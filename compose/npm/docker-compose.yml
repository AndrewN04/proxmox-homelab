services:
  npm:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: npm
    restart: unless-stopped
    ports:
      - "${APPS01_IP}:80:80"
      - "${APPS01_IP}:81:81"
      - "${APPS01_IP}:443:443"
    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - /srv/appdata/npm/data:/data
      - /srv/appdata/npm/letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3
